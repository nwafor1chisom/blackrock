{% extends "public/base.html" %}
{% load static %}
{% block title %}Blog{% endblock %}
{% block content %}

<div class="section-wrapper">

<section style="padding:140px 0 100px; min-height:100vh;">

<div style="max-width:1200px;margin:0 auto;padding:0 20px;">

<!-- HEADER -->
<div style="text-align:center;margin-bottom:40px;">
  <h2 style="font-size:42px;font-weight:800;color:#c9a84c;">BLACKROCK Insights</h2>
  <p style="color:rgba(255,255,255,0.6);font-size:15px;">
    Click any article to read full insights
  </p>
</div>

<!-- GRID -->
<div id="blogGrid"
     style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;">
</div>

</div>

</section>

</div>

<script>
const blogs = [
  {
    id: 1,
    title: "UK lenders slash mortgages after rate cut",
    desc: "Mortgage relief signals easing economic pressure in UK housing market.",
    img: "https://img-s-msn-com.akamaized.net/tenant/amp/entityid/AA21sWVd.img?w=688&h=387&q=90&m=6&f=webp&u=t",
    url: "https://www.msn.com/en-gb/news/insight/uk-s-biggest-lenders-slash-mortgage-rates-amid-market-volatility/gm-GM77577333?gemSnapshotKey=GM77577333-snapshot-7&uxmode=ruby"
  },
  {
  id: 2,
  title: "AI is reshaping global finance systems",
  desc: "Banks and fintech companies are rapidly adopting AI to improve trading, fraud detection, and customer experience.",
  img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=688&h=387&fit=crop",
  url: "https://www.deloitte.com/ng/en/services/consulting-risk/services/how-artificial-intelligence-is-transforming-the-financial-services-industry.html"
},
  {
    id: 3,
    title: "Binance CEO pleads guilty in federal case",
    desc: "Major regulatory milestone in global crypto enforcement.",
    img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkZES2dpupiMMfxLhAJAbDbyhxJDIqy1KyKA&s",
    url: "https://www.justice.gov/archives/opa/pr/binance-and-ceo-plead-guilty-federal-charges-4b-resolution"
  },
  {
    id: 4,
    title: "Huawei unveils new AI chip to rival Nvidia",
    desc: "China accelerates semiconductor competition in global AI race.",
    img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyR1DiagxKHFfHt30SoKNvLKFB4Sr8IQz55g&s",
    url: "https://www.bloomberg.com/news/articles/2025-09-18/huawei-unveils-new-ai-chip-tech-to-rival-nvidia"
  }
];

function renderBlogs(){
  const grid = document.getElementById("blogGrid");

  blogs.forEach(blog => {
    grid.innerHTML += `
      <div style="background:#111114;border:1px solid #2a2410;border-radius:14px;overflow:hidden;transition:0.3s;">

        <!-- IMAGE (CLICKABLE) -->
        <a href="${blog.url}" target="_blank">
          <img src="${blog.img}" 
               style="width:100%;height:200px;object-fit:cover;cursor:pointer;">
        </a>

        <div style="padding:18px;">

          <h3 style="color:#f0ece4;font-size:16px;margin-bottom:10px;">
            ${blog.title}
          </h3>

          <p style="color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:14px;">
            ${blog.desc}
          </p>

          <!-- READ MORE BUTTON -->
          <a href="${blog.url}" target="_blank"
             style="display:inline-block;padding:10px 14px;background:#c9a84c;
                    color:#000;font-weight:700;border-radius:8px;font-size:13px;text-decoration:none;">
            Read More →
          </a>

        </div>

      </div>
    `;
  });
}

renderBlogs();
</script>

{% endblock %}
